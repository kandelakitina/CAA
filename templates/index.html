<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .title }}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js" defer></script>
</head>
<body>
  <main class="shell">
    <section class="card">
      <p class="eyebrow">Первый деплой</p>
      <h1>{{ .title }}</h1>
      <p class="lead">Закрытый сервис размещения, версионирования и согласования документов.</p>

      <div id="deployment-status" class="status-area">
        <button
          type="button"
          hx-post="/demo/status"
          hx-target="#deployment-status"
          hx-swap="innerHTML">
          Проверить HTMX
        </button>
      </div>
    </section>
  </main>
</body>
</html>
