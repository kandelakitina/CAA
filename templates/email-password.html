<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Пароль — Neva Approvals</title><link rel="stylesheet" href="/static/app.css"><script src="/static/theme.js"></script></head>
<body><main class="shell"><section class="card login-card"><h1>{{ if .Forgot }}Восстановление доступа{{ else }}Установить пароль{{ end }}</h1>
{{ if .Message }}<div class="alert" role="status">{{ .Message }}</div>{{ end }}
<form method="post" class="form-stack" action="{{ if .Forgot }}/password/forgot{{ else }}/password/reset{{ end }}"><input type="hidden" name="_csrf" value="{{ .CSRFToken }}">
{{ if .Forgot }}<label>Электронная почта<input type="email" name="email" autocomplete="username" required maxlength="320"></label><button>Отправить ссылку</button>
{{ else }}<input type="hidden" name="token" id="email-token" value="{{ .Token }}"><label>Новый пароль<input type="password" name="password" minlength="8" maxlength="1024" autocomplete="new-password" required></label><label>Повторите пароль<input type="password" name="password_confirmation" minlength="8" maxlength="1024" autocomplete="new-password" required></label><button>Сохранить пароль</button><noscript>Для открытия ссылки включите JavaScript.</noscript>{{ end }}
</form><p><a href="/login">Войти</a> · <a href="/password/forgot">Запросить новую ссылку</a></p></section></main>{{ if not .Forgot }}<script src="/static/email-password.js"></script>{{ end }}</body></html>
