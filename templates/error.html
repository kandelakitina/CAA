<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  <script src="/static/theme.js"></script>
  <script src="/static/error.js" defer></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {{ if .SignedIn }}{{ template "workspace-header" . }}{{ end }}
  <main class="content">
    <section class="card error-card" aria-labelledby="error-title">
      <div class="error-symbol" aria-hidden="true">!</div>
      <h1 id="error-title">{{ .Title }}</h1>
      <p class="error-message" role="alert">{{ .Message }}</p>
      <p class="form-hint">Вернитесь к форме, чтобы проверить данные и доступные действия.</p>
      <div class="admin-actions">
        <button type="button" class="button-secondary" data-error-back hidden>Назад к форме</button>
        <a class="button-link" href="{{ .BackURL }}">{{ .BackLabel }}</a>
      </div>
    </section>
  </main>
</body>
</html>
